<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found | puggietype</title>
    <link rel="stylesheet" href="styles/standalone.scss" />
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/images/favicon/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta name="name" content="puggietype" />
    <meta name="image" content="https://puggietype.com/images/og-image.png" />
    <meta
      name="description"
      content="A minimalist, customizable typing test with a little pug."
    />
    <meta property="og:title" content="puggietype" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="A minimalist, customizable typing test with a little pug."
    />
    <meta
      property="og:image"
      content="https://puggietype.com/images/og-image.png"
    />
    <meta name="theme-color" content="#161514" id="metaThemeColor" />
    <meta name="twitter:title" content="puggietype" />
    <meta
      name="twitter:image"
      content="https://puggietype.com/images/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script type="module" async>
      import { loadCSS } from "./ts/utils/misc";
      loadCSS("/css/fa.min.css", true);
      document.getElementById("page404").classList.remove("hidden");
      document.getElementById("page404").classList.remove("hidden");
      document.querySelector("header").classList.add("focus");
      document.title = "404 Not Found | puggietype";
    </script>
    <load src="html/warnings.html" />
    <style>
      h1 {
        font-weight: unset;
        font-size: 2rem;
        margin-top: 3rem;
        color: var(--sub-color);
      }
      a.button {
        border-radius: var(--roundness);
        text-decoration: none;
        background: var(--sub-alt-color);
        color: var(--text-color);
        &:hover {
          background: var(--text-color);
          color: var(--bg-color);
        }
      }
      .page404 {
        display: grid;
        justify-content: center;
        height: 100%;
        align-content: center;
      }
      .page404 .content {
        display: grid;
        grid-auto-flow: column;
        gap: 4rem;
        grid-template-columns: 300px 300px;
      }
      .page404 .image {
        width: 100%;
        align-self: center;
        max-width: 200px;
        justify-self: center;
        aspect-ratio: 1;
        background-image: url("/images/logo/pug-head.svg");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        border-radius: var(--roundness);
      }

      .page404 .title {
        font-size: 5rem;
        line-height: 4rem;
        /* margin: -3rem; */
        color: var(--main-color);
        align-self: center;
      }

      .page404 .side {
        justify-items: center;
        display: grid;
        gap: 1rem;
        text-align: center;
      }
      .page404 .big {
        font-size: 10rem;
        line-height: 10rem;
        color: var(--sub-color);
      }

      .page404 .button {
        padding: 1rem 2rem;
        width: max-content;
      }
    </style>
    <div id="app" class="content-grid focus">
      <header class="focus">
        <a id="logo" href="/" router-link="">
          <div class="icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 64 64"
              style="color: var(--main-color)"
            >
              <path
                d="M5,52 C4,30 16,14 32,14 C48,14 60,30 59,52 Z"
                style="fill: var(--pug-fill, #f0d9b5)"
                stroke="currentColor"
                stroke-width="3.4"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
              <path
                d="M20,20 C13,18 7,23 7,31 C7,36 10,38 13.5,36 C16,34 17,29 22,26 Z M44,20 C51,18 57,23 57,31 C57,36 54,38 50.5,36 C48,34 47,29 42,26 Z"
                style="fill: var(--pug-mask, #3b2b23)"
                stroke="currentColor"
                stroke-width="3.4"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
              <path
                d="M28,24 q4,-2 8,0"
                style="fill: none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
              <circle cx="23" cy="32.5" r="3.4" fill="currentColor" />
              <circle cx="41" cy="32.5" r="3.4" fill="currentColor" />
              <rect
                x="20"
                y="38"
                width="24"
                height="9"
                rx="4.5"
                fill="var(--pug-mask, #3B2B23)"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M30,41.5 h4"
                style="fill: none"
                stroke="var(--pug-fill, #F0D9B5)"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <h1 class="text">
            <div class="top">type fast. stay cute.</div>
            puggietype
          </h1>
        </a>
      </header>
      <main style="height: 100%">
        <div class="page page404 hidden" id="page404">
          <div class="content">
            <div class="image"></div>
            <div class="side">
              <div class="title">404</div>
              <div>page not found</div>
              <div>This pug sniffed around, but there's nothing here.</div>
              <a href="/" class="button">
                <i class="fas fa-home"></i>
                Go Home
              </a>
              <a href="/race" class="button">
                <i class="fas fa-flag-checkered"></i>
                Race a friend
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
