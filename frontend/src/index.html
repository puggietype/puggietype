<!doctype html>
<html lang="en">
  <head>
    <!-- typing font: needed once the app renders, not for the first paint -->
    <link
      rel="preload"
      href="/webfonts/JetBrainsMono-Regular.woff2"
      type="font/woff2"
      as="font"
      fetchpriority="low"
      crossorigin
    />
    <link
      rel="preload"
      href="/webfonts/Lexend-Regular.woff2"
      type="font/woff2"
      as="font"
      crossorigin
    />

    <script>
      document.addEventListener("keydown", function (e) {
        if (e.key == "Escape") e.preventDefault();
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>puggietype | a minimalist typing test</title>
    <!-- fallback theme colors (puggie dark) -->
    <style>
      :root {
        --bg-color: #161514;
        --main-color: #e8a96b;
        --caret-color: #e8a96b;
        --sub-color: #77706a;
        --sub-alt-color: #211f1d;
        --text-color: #ece6dd;
        --error-color: #ef6b5f;
        --error-extra-color: #a84a43;
        --colorful-error-color: #ef6b5f;
        --colorful-error-extra-color: #a84a43;
        --nav-focus-opacity: 0;
      }
    </style>
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/images/favicon/favicon.svg" type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />
    <meta name="theme-color" content="#161514" />
    <meta name="name" content="puggietype | a minimalist typing test" />
    <meta name="image" content="https://puggietype.com/images/og-image.png" />
    <meta
      name="description"
      content="A minimalist, customizable typing test with a little pug. Type fast, stay cute, and race your friends."
    />
    <meta
      name="keywords"
      content="typing test, puggietype, speed test, typing, wpm, typing race"
    />
    <meta property="og:title" content="puggietype | a minimalist typing test" />
    <meta property="og:site_name" content="puggietype" />
    <meta property="og:url" content="https://puggietype.com/" />
    <link rel="canonical" href="https://puggietype.com/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://puggietype.com/images/og-image.png"
    />
    <meta
      property="og:description"
      content="A minimalist, customizable typing test with a little pug. Type fast, stay cute, and race your friends."
    />
    <meta
      name="twitter:title"
      content="puggietype | a minimalist typing test"
    />
    <meta
      name="twitter:image"
      content="https://puggietype.com/images/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="darkreader-lock" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <style>
      /* 
      Layer order NEEDS to be here and one layer per line.
      This is because vite changes the order of the css imports,
      and the layer definition needs to be at the very very top, otherwise things break.
    */
      @layer normalize;
      @layer theme;
      @layer base;
      @layer components;
      @layer properties;
      @layer vendor;
      @layer custom-styles;
      @layer hidden;
      @layer utilities;
    </style>
    <link rel="stylesheet" class="testtesttest" href="styles/index.scss" />
    <link rel="stylesheet" class="testtest" href="styles/tailwind.css" />
    <link rel="stylesheet" class="test" href="styles/vendor.scss" />

    <style class="customFont" type="text/css"></style>
  </head>

  <body class="loading">
    <!-- shown without js or css, so it can't be rendered by solid -->
    <load src="html/warnings.html" />
    <load src="html/app-shell.html" />
    <link rel="stylesheet" href="" id="globalFunBoxTheme" type="text/css" />
    <!-- renders the app after the markup above -->
    <script type="module" src="ts/boot.ts"></script>
  </body>
</html>
